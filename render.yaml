# Déploiement gratuit sur Render.com
# "New +" → "Blueprint" → sélectionne ce dépôt GitHub.
services:
  - type: web
    name: classmemo
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # à coller : chaîne de connexion Neon (postgresql://…)
      - key: ANTHROPIC_API_KEY
        sync: false # facultatif : sinon génération heuristique locale
      - key: VAPID_PUBLIC_KEY
        sync: false # facultatif : `npm -w server run vapid` (rappels push)
      - key: VAPID_PRIVATE_KEY
        sync: false # facultatif : idem
      - key: REMINDER_TZ
        value: Africa/Kinshasa
