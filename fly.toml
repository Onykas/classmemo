# Déploiement Fly.io — `fly launch` régénère ce fichier, garde le bloc [[mounts]].
app = "classmemo"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "4000"
  DATA_DIR = "/data"

[[mounts]]
  source = "classmemo_data"
  destination = "/data"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
